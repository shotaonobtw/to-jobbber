<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHubユーザー情報</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-800">
  <main class="mx-auto max-w-xl">
    <header class="mb-8 text-center">
      <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-blue-600">
        GitHub API
      </p>
      <h1 class="text-3xl font-bold">ユーザー情報を検索</h1>
      <p class="mt-3 text-slate-600">
        GitHubのユーザー名を入力してください。
      </p>
    </header>

    <form id="search-form" class="flex flex-col gap-3 rounded-2xl bg-white p-5 shadow-md sm:flex-row">
      <label for="username" class="sr-only">GitHubユーザー名</label>
      <input
        id="username"
        type="text"
        placeholder="例：octocat"
        autocomplete="off"
        required
        class="min-w-0 flex-1 rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
      >
      <button
        id="search-button"
        type="submit"
        class="rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
      >
        検索
      </button>
    </form>

    <p
      id="status-message"
      class="mt-5 hidden rounded-lg p-4 text-center text-sm"
      aria-live="polite"
    ></p>

    <section
      id="user-card"
      class="mt-5 hidden rounded-2xl bg-white p-6 shadow-md"
      aria-label="GitHubユーザー情報"
    >
      <div class="flex flex-col items-center gap-5 sm:flex-row sm:items-start">
        <img
          id="avatar"
          class="size-24 rounded-full border-4 border-slate-100 object-cover"
          alt=""
        >

        <div class="min-w-0 text-center sm:text-left">
          <h2 id="name" class="break-words text-2xl font-bold"></h2>
          <p id="login" class="mt-1 break-words text-slate-500"></p>
          <p id="bio" class="mt-4 break-words leading-7 text-slate-700"></p>
          <p class="mt-4 text-sm text-slate-600">
            フォロワー：
            <span id="followers" class="font-semibold text-slate-900"></span>
            人
          </p>
          <a
            id="profile-link"
            class="mt-4 inline-block font-semibold text-blue-600 hover:underline"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHubプロフィールを見る
          </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#search-form");
    const usernameInput = document.querySelector("#username");
    const searchButton = document.querySelector("#search-button");
    const statusMessage = document.querySelector("#status-message");
    const userCard = document.querySelector("#user-card");
    const avatar = document.querySelector("#avatar");
    const name = document.querySelector("#name");
    const login = document.querySelector("#login");
    const bio = document.querySelector("#bio");
    const followers = document.querySelector("#followers");
    const profileLink = document.querySelector("#profile-link");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();

      if (username === "") {
        userCard.classList.add("hidden");
        statusMessage.textContent = "GitHubユーザー名を入力してください。";
        statusMessage.className =
          "mt-5 rounded-lg bg-red-100 p-4 text-center text-sm text-red-700";
        return;
      }

      userCard.classList.add("hidden");
      statusMessage.textContent = "読み込み中...";
      statusMessage.className =
        "mt-5 rounded-lg bg-blue-100 p-4 text-center text-sm text-blue-700";
      searchButton.disabled = true;

      try {
        const response = await fetch(
          `https://api.github.com/users/${encodeURIComponent(username)}`
        );

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error("ユーザーが見つかりませんでした");
          }

          throw new Error("情報を取得できませんでした。時間をおいて再度お試しください。");
        }

        const userData = await response.json();

        console.log(userData);

        avatar.src = userData.avatar_url;
        avatar.alt = `${userData.login}のアバター`;
        name.textContent = userData.name || userData.login;
        login.textContent = `@${userData.login}`;
        bio.textContent = userData.bio || "自己紹介は登録されていません。";
        followers.textContent = userData.followers.toLocaleString("ja-JP");
        profileLink.href = userData.html_url;

        statusMessage.classList.add("hidden");
        userCard.classList.remove("hidden");
      } catch (error) {
        userCard.classList.add("hidden");
        statusMessage.textContent =
          error instanceof Error
            ? error.message
            : "予期しないエラーが発生しました。";
        statusMessage.className =
          "mt-5 rounded-lg bg-red-100 p-4 text-center text-sm text-red-700";
      } finally {
        searchButton.disabled = false;
      }
    });
  </script>
</body>
</html>
