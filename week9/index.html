<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー登録フォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-800">
  <main class="mx-auto max-w-lg rounded-2xl bg-white p-6 shadow-lg sm:p-8">
    <header class="mb-8">
      <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-blue-600">
        Create account
      </p>
      <h1 class="text-2xl font-bold">ユーザー登録</h1>
      <p class="mt-2 text-sm leading-6 text-slate-600">
        以下の項目を入力してください。
      </p>
    </header>

    <form id="registration-form" novalidate class="space-y-5">
      <div>
        <label for="name" class="mb-2 block font-semibold">名前</label>
        <input
          id="name"
          name="name"
          type="text"
          required
          autocomplete="name"
          aria-describedby="name-error"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
        >
        <p id="name-error" class="mt-2 hidden text-sm text-red-700"></p>
      </div>

      <div>
        <label for="email" class="mb-2 block font-semibold">メールアドレス</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
          aria-describedby="email-error"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
        >
        <p id="email-error" class="mt-2 hidden text-sm text-red-700"></p>
      </div>

      <div>
        <label for="password" class="mb-2 block font-semibold">パスワード</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="8"
          autocomplete="new-password"
          aria-describedby="password-error"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
        >
        <p id="password-error" class="mt-2 hidden text-sm text-red-700"></p>
      </div>

      <div>
        <label class="flex items-start gap-3">
          <input
            id="terms"
            name="terms"
            type="checkbox"
            required
            aria-describedby="terms-error"
            class="mt-1 size-4 accent-blue-600"
          >
          <span class="text-sm leading-6">利用規約に同意します</span>
        </label>
        <p id="terms-error" class="mt-2 hidden text-sm text-red-700"></p>
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2"
      >
        登録する
      </button>
    </form>

    <p
      id="form-message"
      class="mt-5 hidden rounded-lg p-4 text-sm font-semibold"
      aria-live="polite"
    ></p>
  </main>

  <script>
    const form = document.querySelector("#registration-form");
    const nameInput = document.querySelector("#name");
    const emailInput = document.querySelector("#email");
    const passwordInput = document.querySelector("#password");
    const termsInput = document.querySelector("#terms");
    const formMessage = document.querySelector("#form-message");

    const fields = [
      {
        input: nameInput,
        error: document.querySelector("#name-error")
      },
      {
        input: emailInput,
        error: document.querySelector("#email-error")
      },
      {
        input: passwordInput,
        error: document.querySelector("#password-error")
      },
      {
        input: termsInput,
        error: document.querySelector("#terms-error")
      }
    ];

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      fields.forEach((field) => {
        field.error.textContent = "";
        field.error.classList.add("hidden");
        field.input.setAttribute("aria-invalid", "false");
      });

      formMessage.textContent = "";
      formMessage.classList.add("hidden");
      formMessage.classList.remove("bg-green-100", "text-green-800");

      let firstInvalidInput = null;

      const showError = (field, message) => {
        field.error.textContent = message;
        field.error.classList.remove("hidden");
        field.input.setAttribute("aria-invalid", "true");

        if (firstInvalidInput === null) {
          firstInvalidInput = field.input;
        }
      };

      const nameField = fields[0];
      const emailField = fields[1];
      const passwordField = fields[2];
      const termsField = fields[3];

      if (nameInput.value.trim() === "") {
        showError(nameField, "名前を入力してください。");
      }

      if (emailInput.value.trim() === "") {
        showError(emailField, "メールアドレスを入力してください。");
      } else if (emailInput.validity.typeMismatch) {
        showError(emailField, "有効なメールアドレスを入力してください。");
      }

      if (passwordInput.value === "") {
        showError(passwordField, "パスワードを入力してください。");
      } else if (passwordInput.value.length < 8) {
        showError(passwordField, "パスワードは8文字以上で入力してください。");
      }

      if (!termsInput.checked) {
        showError(termsField, "利用規約を確認して、チェックを入れてください。");
      }

      if (firstInvalidInput !== null) {
        firstInvalidInput.focus();
        return;
      }

      formMessage.textContent = "登録完了！入力内容を確認しました。";
      formMessage.classList.remove("hidden");
      formMessage.classList.add("bg-green-100", "text-green-800");
    });
  </script>
</body>
</html>
