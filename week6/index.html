<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI計算ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-300 p-4 text-slate-800">
  <main class="mx-auto max-w-md rounded-2xl bg-orange-400 p-6 shadow-lg">
    <h1 class="mb-6 text-center text-2xl font-bold">BMI計算ツール</h1>

    <p class="mb-5 text-sm leading-6 text-slate-600">
      身長と体重を入力すると、BMIの目安と判定結果を表示します。
    </p>

    <form id="bmi-form" class="space-y-5">
      <div>
        <label for="height" class="mb-2 block font-semibold">身長（cm）</label>
        <input
          id="height"
          name="height"
          type="number"
          min="0"
          step="any"
          placeholder="例：170"
          class="w-full rounded-lg border border-slate-300 px-3 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
        >
      </div>

      <div>
        <label for="weight" class="mb-2 block font-semibold">体重（kg）</label>
        <input
          id="weight"
          name="weight"
          type="number"
          min="0"
          step="any"
          placeholder="例：60"
          class="w-full rounded-lg border border-slate-300 px-3 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
        >
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700"
      >
        計算する
      </button>
    </form>

    <div
      id="result"
      class="mt-6 hidden rounded-xl bg-blue-50 p-4 text-sm leading-6 text-slate-700"
      aria-live="polite"
    ></div>
  </main>

  <script>
    const form = document.querySelector("#bmi-form");
    const heightInput = document.querySelector("#height");
    const weightInput = document.querySelector("#weight");
    const result = document.querySelector("#result");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const height = Number(heightInput.value);
      const weight = Number(weightInput.value);

      result.classList.remove("bg-red-50", "text-red-700", "border", "border-red-200");
      result.classList.add("bg-blue-50", "text-slate-700");
      result.classList.remove("hidden");

      if (
        heightInput.value.trim() === "" ||
        weightInput.value.trim() === "" ||
        !Number.isFinite(height) ||
        !Number.isFinite(weight) ||
        height <= 0 ||
        weight <= 0
      ) {
        result.textContent =
          "身長と体重に、0より大きい数値を入力してください。例：身長170cm、体重60kg";
        result.classList.remove("bg-blue-50", "text-slate-700");
        result.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
        return;
      }

      const heightInMeters = height / 100;
      const bmi = weight / (heightInMeters * heightInMeters);
      let category = "";

      if (bmi < 18.5) {
        category = "痩せ型";
      } else if (bmi < 25) {
        category = "普通体重";
      } else {
        category = "肥満";
      }

      result.textContent = `あなたのBMIは ${bmi.toFixed(1)}、判定は「${category}」です。`;
    });
  </script>
</body>
</html>
