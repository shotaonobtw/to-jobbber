<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チームメンバー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-800">
  <main class="mx-auto max-w-6xl">
    <header class="mb-8 text-center">
      <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-blue-600">
        Our Team
      </p>
      <h1 class="text-3xl font-bold">チームメンバー</h1>
      <p class="mt-3 text-slate-600">
        一緒にサービスを作っているメンバーを紹介します。
      </p>
    </header>

    <section
      id="member-list"
      class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"
      aria-label="チームメンバー一覧"
    ></section>
  </main>

  <script>
    const members = [
      {
        name: "佐藤 花子",
        role: "エンジニア",
        comment: "使いやすくて安心できるサービスを作ります。"
      },
      {
        name: "鈴木 太郎",
        role: "デザイナー",
        comment: "見た目だけでなく、使いやすさも大切にしています。"
      },
      {
        name: "高橋 美咲",
        role: "プロダクトマネージャー",
        comment: "チームと利用者の声をつなぐ役割を担当しています。"
      },
      {
        name: "田中 健",
        role: "エンジニア",
        comment: "新しい技術を学びながら、丁寧に開発しています。"
      },
      {
        name: "伊藤 葵",
        role: "デザイナー",
        comment: "誰にとっても分かりやすい画面を目指しています。"
      }
    ];

    const memberList = document.querySelector("#member-list");

    members.forEach((member) => {
      const card = document.createElement("article");
      card.className = "rounded-xl bg-white p-6 shadow-md";

      const name = document.createElement("h2");
      name.className = "text-xl font-bold";
      name.textContent = member.name;

      const role = document.createElement("p");
      role.className = "mt-2 inline-block rounded-full bg-blue-100 px-3 py-1 text-sm font-semibold text-blue-700";
      role.textContent = member.role;

      const comment = document.createElement("p");
      comment.className = "mt-4 leading-7 text-slate-600";
      comment.textContent = member.comment;

      card.appendChild(name);
      card.appendChild(role);
      card.appendChild(comment);
      memberList.appendChild(card);
    });
  </script>
</body>
</html>
